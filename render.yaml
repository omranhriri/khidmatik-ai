services:
  - type: web
    name: khidmatik-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/khidmatik.db
    disk:
      name: khidmatik-data
      mountPath: /var/data
      sizeGB: 1
